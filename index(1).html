<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Polychromatic</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --cream:#F7F4EE;--ink:#1A1612;--muted:#7A7167;--accent:#C4410C;--border:#DDD8CF;
  --film:#1A1612;--series:#1A4A6B;--game:#1A4A2E;--book:#5C2D1A;--art:#4A1A5C;
}
body{background:var(--cream);color:var(--ink);font-family:'Crimson Pro',serif;font-size:18px;line-height:1.6}
a{color:inherit;text-decoration:none}
header{border-bottom:1px solid var(--border);padding:2.5rem 0 2rem;text-align:center;background:var(--cream);position:sticky;top:0;z-index:100}
.site-title{font-family:'Playfair Display',serif;font-size:2.2rem;font-weight:700;letter-spacing:0.02em}
.site-sub{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.18em;text-transform:uppercase;color:var(--muted);margin-top:4px}
.header-nav{display:flex;justify-content:center;gap:0;margin-top:1.2rem;border-top:1px solid var(--border);padding-top:1rem;flex-wrap:wrap}
.filter-btn{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;padding:6px 16px;cursor:pointer;background:none;border:none;color:var(--muted);transition:color 0.2s;border-bottom:2px solid transparent}
.filter-btn:hover{color:var(--ink)}
.filter-btn.active{color:var(--ink);border-bottom:2px solid var(--ink)}
main{max-width:760px;margin:0 auto;padding:0 2rem}
.status-bar{max-width:760px;margin:1rem auto 0;padding:0 2rem}
.status-msg{font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.1em;text-transform:uppercase;padding:10px 14px;display:none}
.status-msg.show{display:block}
.status-msg.loading{color:var(--muted);background:#f0ede8;border-left:3px solid var(--muted)}
.status-msg.success{color:#1A4A2E;background:#e8f5ec;border-left:3px solid #1A4A2E}
.status-msg.error{color:#5C2D1A;background:#f7ede8;border-left:3px solid #C4410C}
.entry{display:grid;grid-template-columns:220px 1fr;gap:0;border-bottom:1px solid var(--border);padding:3rem 0}
.entry:first-of-type{border-top:1px solid var(--border);margin-top:2rem}
.entry-media{position:relative;overflow:hidden;background:#1a1612;height:300px;flex-shrink:0}
.entry-media img{width:100%;height:100%;object-fit:cover;display:block;opacity:0.92;transition:opacity 0.4s}
.entry:hover .entry-media img{opacity:1}
.entry-placeholder{width:100%;height:100%;display:flex;align-items:center;justify-content:center;padding:1rem}
.entry-placeholder span{font-family:'Playfair Display',serif;color:rgba(255,255,255,0.15);font-size:2.2rem;text-align:center;line-height:1.2}
.cat-badge{position:absolute;top:12px;left:12px;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:0.16em;text-transform:uppercase;padding:4px 10px;color:#fff;font-weight:500}
.cat-film .cat-badge{background:var(--film)}
.cat-series .cat-badge{background:var(--series)}
.cat-game .cat-badge{background:var(--game)}
.cat-book .cat-badge{background:var(--book)}
.cat-art .cat-badge{background:var(--art)}
.entry-body{padding:0 0 0 2.5rem;display:flex;flex-direction:column;justify-content:center}
.entry-meta-top{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:0.6rem}
.entry-title{font-family:'Playfair Display',serif;font-size:2rem;font-weight:700;line-height:1.15;margin-bottom:0.3rem}
.entry-creator{font-family:'Crimson Pro',serif;font-style:italic;font-size:1rem;color:var(--muted);margin-bottom:1.2rem}
.entry-rating{display:flex;align-items:baseline;gap:8px;margin-bottom:1rem}
.rating-num{font-family:'Playfair Display',serif;font-size:1.4rem;font-weight:700}
.rating-divider{color:var(--border);font-size:1.2rem}
.rating-max{font-family:'DM Sans',sans-serif;font-size:11px;color:var(--muted)}
.entry-thought{font-family:'Crimson Pro',serif;font-size:1.05rem;line-height:1.75;color:#3A3530}
.entry-date{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:0.12em;text-transform:uppercase;color:var(--muted);margin-top:1.4rem}
.delete-btn{font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:0.1em;text-transform:uppercase;color:var(--muted);background:none;border:none;cursor:pointer;margin-top:0.6rem;padding:0;transition:color 0.2s;text-align:left}
.delete-btn:hover{color:var(--accent)}
.write-btn{position:fixed;bottom:2rem;right:2rem;background:var(--accent);color:#fff;border:none;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.12em;text-transform:uppercase;padding:14px 22px;cursor:pointer;z-index:200;transition:background 0.2s;box-shadow:0 4px 20px rgba(196,65,12,0.3)}
.write-btn:hover{background:#A3350A}
.modal-overlay{display:none;position:fixed;inset:0;background:rgba(26,22,18,0.75);z-index:300;align-items:flex-start;justify-content:center;overflow-y:auto;padding:2rem}
.modal-overlay.open{display:flex}
.modal{background:var(--cream);padding:2.5rem;width:560px;max-width:95vw;position:relative;margin:auto}
.modal h2{font-family:'Playfair Display',serif;font-size:1.6rem;margin-bottom:1.8rem;font-weight:700}
.modal-close{position:absolute;top:1.2rem;right:1.5rem;background:none;border:none;font-size:1.4rem;cursor:pointer;color:var(--muted);font-family:'DM Sans',sans-serif;line-height:1}
.form-row{margin-bottom:1.2rem}
.form-row label{display:block;font-family:'DM Sans',sans-serif;font-size:11px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);margin-bottom:6px}
.form-row input,.form-row select,.form-row textarea{width:100%;background:#fff;border:1px solid var(--border);padding:10px 14px;font-family:'Crimson Pro',serif;font-size:1rem;color:var(--ink);outline:none;transition:border-color 0.2s;resize:vertical;-webkit-appearance:none;appearance:none}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--accent)}
.form-row textarea{min-height:130px;line-height:1.65}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:1rem}
.img-preview{width:100%;height:160px;object-fit:cover;margin-top:8px;display:none}
.submit-btn{width:100%;background:var(--ink);color:var(--cream);border:none;padding:14px;font-family:'DM Sans',sans-serif;font-size:12px;letter-spacing:0.16em;text-transform:uppercase;cursor:pointer;margin-top:0.5rem;transition:background 0.2s}
.submit-btn:hover{background:var(--accent)}
.submit-btn:disabled{opacity:0.5;cursor:not-allowed}
.empty-state{text-align:center;padding:6rem 2rem;color:var(--muted);font-family:'Crimson Pro',serif;font-style:italic;font-size:1.2rem}
footer{text-align:center;padding:3rem 2rem;font-family:'DM Sans',sans-serif;font-size:10px;letter-spacing:0.14em;text-transform:uppercase;color:var(--muted);border-top:1px solid var(--border);margin-top:2rem}
@media(max-width:600px){
  .entry{grid-template-columns:1fr}
  .entry-media{height:220px}
  .entry-body{padding:1.5rem 0 0}
}
</style>
</head>
<body>

<header>
  <div class="site-title">Polychromatic</div>
  <div class="site-sub">A personal journal by Zidan</div>
  <nav class="header-nav">
    <button class="filter-btn active" data-filter="all">All</button>
    <button class="filter-btn" data-filter="film">Film</button>
    <button class="filter-btn" data-filter="series">Series</button>
    <button class="filter-btn" data-filter="game">Game</button>
    <button class="filter-btn" data-filter="book">Book</button>
    <button class="filter-btn" data-filter="art">Art &amp; Other</button>
  </nav>
</header>

<div class="status-bar">
  <div class="status-msg" id="statusMsg"></div>
</div>

<main id="feed"></main>

<button class="write-btn" id="openModal">+ New Entry</button>

<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="closeModal">&#10005;</button>
    <h2>New Entry</h2>
    <div class="form-grid">
      <div class="form-row">
        <label>Category</label>
        <select id="fCat">
          <option value="film">Film</option>
          <option value="series">Series</option>
          <option value="game">Game</option>
          <option value="book">Book</option>
          <option value="art">Art &amp; Other</option>
        </select>
      </div>
      <div class="form-row">
        <label>Rating (out of 5 or 10)</label>
        <input type="number" id="fRating" min="0" max="10" step="0.5" placeholder="4.0">
      </div>
    </div>
    <div class="form-row">
      <label>Title</label>
      <input type="text" id="fTitle" placeholder="Parasite">
    </div>
    <div class="form-row">
      <label>Creator / Director / Author / Studio</label>
      <input type="text" id="fCreator" placeholder="Bong Joon-ho">
    </div>
    <div class="form-row">
      <label>Year</label>
      <input type="text" id="fYear" placeholder="2019">
    </div>
    <div class="form-row">
      <label>Your Thought</label>
      <textarea id="fThought" placeholder="Write your short thought, impression, or reaction here..."></textarea>
    </div>
    <div class="form-row">
      <label>Cover Image URL (optional)</label>
      <input type="text" id="fImg" placeholder="https://image.tmdb.org/...">
      <img id="imgPreview" class="img-preview" alt="cover preview">
    </div>
    <button class="submit-btn" id="submitEntry">Add to Journal</button>
  </div>
</div>

<footer>Polychromatic &mdash; a personal media journal</footer>

<script>
const GITHUB_TOKEN = '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';
const GITHUB_USER = 'zidanepiz';
const GITHUB_REPO = 'zidanepiz.github.io';
const FILE_PATH = 'entries.json';
const API_BASE = `https://api.github.com/repos/${GITHUB_USER}/${GITHUB_REPO}/contents/${FILE_PATH}`;

const CAT_LABELS = {film:'Film',series:'Series',game:'Game',book:'Book',art:'Art & Other'};
const PLACEHOLDER_BG = {film:'#2C2420',series:'#1A2E3D',game:'#1A2E22',book:'#2E1A12',art:'#1E1228'};

let entries = [];
let fileSha = null;
let activeFilter = 'all';

function showStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className = `status-msg show ${type}`;
  if (type === 'success') setTimeout(() => el.classList.remove('show'), 3000);
}
function hideStatus() { document.getElementById('statusMsg').classList.remove('show'); }

async function loadEntries() {
  showStatus('Loading entries...', 'loading');
  try {
    const res = await fetch(API_BASE, {
      headers: {'Authorization':`token ${GITHUB_TOKEN}`,'Accept':'application/vnd.github.v3+json'}
    });
    if (res.status === 404) { entries = []; fileSha = null; hideStatus(); renderFeed(); return; }
    if (!res.ok) throw new Error('Failed to load');
    const data = await res.json();
    fileSha = data.sha;
    entries = JSON.parse(atob(data.content.replace(/\n/g, '')));
    hideStatus();
    renderFeed();
  } catch(e) {
    showStatus('Could not load entries. Check your connection.', 'error');
  }
}

async function saveEntries() {
  const content = btoa(unescape(encodeURIComponent(JSON.stringify(entries, null, 2))));
  const body = {message:'Update entries', content, ...(fileSha ? {sha: fileSha} : {})};
  const res = await fetch(API_BASE, {
    method: 'PUT',
    headers: {'Authorization':`token ${GITHUB_TOKEN}`,'Accept':'application/vnd.github.v3+json','Content-Type':'application/json'},
    body: JSON.stringify(body)
  });
  if (!res.ok) { const err = await res.json(); throw new Error(err.message || 'Save failed'); }
  const data = await res.json();
  fileSha = data.content.sha;
}

function formatDate() {
  return new Date().toLocaleDateString('en-GB', {month:'short', year:'numeric'});
}

function renderEntry(e) {
  const media = e.img
    ? `<img src="${e.img}" alt="${e.title}" onerror="this.style.display='none'">`
    : `<div class="entry-placeholder" style="background:${PLACEHOLDER_BG[e.cat]}"><span>${e.title}</span></div>`;
  const ratingMax = e.ratingMax || (e.rating > 5 ? 10 : 5);
  return `
  <article class="entry cat-${e.cat}">
    <div class="entry-media">
      ${media}
      <span class="cat-badge">${CAT_LABELS[e.cat]}</span>
    </div>
    <div class="entry-body">
      <div class="entry-meta-top">${e.year || '—'}</div>
      <h2 class="entry-title">${e.title}</h2>
      <div class="entry-creator">${e.creator}</div>
      ${(e.rating !== '—' && e.rating !== undefined) ? `
      <div class="entry-rating">
        <span class="rating-num">${e.rating}</span>
        <span class="rating-divider">/</span>
        <span class="rating-max">${ratingMax}</span>
      </div>` : ''}
      <p class="entry-thought">${e.thought}</p>
      <div class="entry-date">${e.date}</div>
      <button class="delete-btn" onclick="deleteEntry(${e.id})">Remove entry</button>
    </div>
  </article>`;
}

function renderFeed() {
  const feed = document.getElementById('feed');
  const filtered = activeFilter === 'all' ? entries : entries.filter(e => e.cat === activeFilter);
  if (filtered.length === 0) {
    feed.innerHTML = `<div class="empty-state">Nothing here yet${activeFilter !== 'all' ? ' in this category' : ''}. Add your first entry.</div>`;
    return;
  }
  feed.innerHTML = filtered.map(renderEntry).join('');
}

window.deleteEntry = async function(id) {
  if (!confirm('Remove this entry?')) return;
  entries = entries.filter(e => e.id !== id);
  renderFeed();
  showStatus('Removing entry...', 'loading');
  try {
    await saveEntries();
    showStatus('Entry removed.', 'success');
  } catch(err) {
    showStatus('Error: ' + err.message, 'error');
    await loadEntries();
  }
};

document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    activeFilter = btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderFeed();
  });
});

const overlay = document.getElementById('modalOverlay');
document.getElementById('openModal').addEventListener('click', () => overlay.classList.add('open'));
document.getElementById('closeModal').addEventListener('click', () => overlay.classList.remove('open'));
overlay.addEventListener('click', e => { if (e.target === overlay) overlay.classList.remove('open'); });

document.getElementById('fImg').addEventListener('input', function() {
  const prev = document.getElementById('imgPreview');
  if (this.value) { prev.src = this.value; prev.style.display = 'block'; }
  else prev.style.display = 'none';
});

document.getElementById('submitEntry').addEventListener('click', async () => {
  const title = document.getElementById('fTitle').value.trim();
  const thought = document.getElementById('fThought').value.trim();
  if (!title || !thought) { alert('Title and your thought are required.'); return; }
  const ratingRaw = parseFloat(document.getElementById('fRating').value);
  const ratingMax = ratingRaw > 5 ? 10 : 5;
  const nextId = entries.length > 0 ? Math.max(...entries.map(e => e.id)) + 1 : 1;
  const entry = {
    id: nextId,
    cat: document.getElementById('fCat').value,
    title,
    creator: document.getElementById('fCreator').value.trim() || 'Unknown',
    year: document.getElementById('fYear').value.trim() || '—',
    rating: isNaN(ratingRaw) ? '—' : ratingRaw,
    ratingMax,
    thought,
    img: document.getElementById('fImg').value.trim(),
    date: formatDate()
  };
  entries.unshift(entry);
  overlay.classList.remove('open');
  ['fTitle','fCreator','fYear','fRating','fThought','fImg'].forEach(id => document.getElementById(id).value = '');
  document.getElementById('imgPreview').style.display = 'none';
  activeFilter = 'all';
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  document.querySelector('[data-filter="all"]').classList.add('active');
  renderFeed();
  showStatus('Saving entry...', 'loading');
  const btn = document.getElementById('submitEntry');
  btn.disabled = true;
  try {
    await saveEntries();
    showStatus('Entry saved and live!', 'success');
  } catch(err) {
    showStatus('Error saving: ' + err.message, 'error');
    entries.shift();
    renderFeed();
  } finally {
    btn.disabled = false;
  }
});

loadEntries();
</script>
</body>
</html>
